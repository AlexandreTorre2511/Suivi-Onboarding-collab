<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Prototype de l'application Suivi de Mission Inov Team : suivi des collaborateurs en mission par les managers, les RH et les commerciaux.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Suivi de Mission Inov</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: en-tête fixe, navigation latérale (rangée défilante sur mobile), zone de travail à droite */
:root{
  --bg:#F3F6FA; --surface:#FFFFFF; --sunk:#EAEFF5; --line:#D8E0EA; --line-2:#C5D0DC;
  --fg:#132034; --muted:#5A6879; --accent:#1565C0; --accent-2:#0D4C95; --accent-soft:#E2EDFB; --on-accent:#FFFFFF;
  --ok:#2E7D4F; --ok-soft:#DEF1E5; --warn:#A86200; --warn-soft:#FBEBD1; --bad:#C62828; --bad-soft:#FADCDA;
  --c-man:#1565C0; --c-rh:#00808C; --c-com:#6A4FB3; --c-ev:#AD1457;
  --c-man-soft:#E2EDFB; --c-rh-soft:#D9F1F2; --c-com-soft:#ECE6F8; --c-ev-soft:#F9E0EA;
  --f-ui:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px; --shadow:0 1px 2px rgba(19,32,52,.06),0 4px 16px rgba(19,32,52,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D131B; --surface:#141C26; --sunk:#1B2532; --line:#283544; --line-2:#344457;
  --fg:#E3EAF2; --muted:#93A2B4; --accent:#6AAEF5; --accent-2:#9CC9FA; --accent-soft:#14283F; --on-accent:#06172A;
  --ok:#6CCB92; --ok-soft:#163325; --warn:#F0B35A; --warn-soft:#382811; --bad:#F2867E; --bad-soft:#3B1C1A;
  --c-man:#6AAEF5; --c-rh:#4FC9D3; --c-com:#B9A4F0; --c-ev:#F07FAE;
  --c-man-soft:#14283F; --c-rh-soft:#0F3236; --c-com-soft:#261F3D; --c-ev-soft:#3A1828;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D131B; --surface:#141C26; --sunk:#1B2532; --line:#283544; --line-2:#344457;
  --fg:#E3EAF2; --muted:#93A2B4; --accent:#6AAEF5; --accent-2:#9CC9FA; --accent-soft:#14283F; --on-accent:#06172A;
  --ok:#6CCB92; --ok-soft:#163325; --warn:#F0B35A; --warn-soft:#382811; --bad:#F2867E; --bad-soft:#3B1C1A;
  --c-man:#6AAEF5; --c-rh:#4FC9D3; --c-com:#B9A4F0; --c-ev:#F07FAE;
  --c-man-soft:#14283F; --c-rh-soft:#0F3236; --c-com-soft:#261F3D; --c-ev-soft:#3A1828;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-ui);font-size:14px;line-height:1.5}
h1,h2,h3,h4{margin:0;text-wrap:balance}
h1{font-size:22px;font-weight:800;letter-spacing:-.015em}
h2{font-size:16px;font-weight:700}
h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12px}

/* En-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-inline:16px;padding-block:10px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:-.02em}
.brand b{font-weight:800;letter-spacing:-.01em}
.brand span{display:block;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.who label{font-size:12px;color:var(--muted)}
select,input[type=text],input[type=date],input[type=time],input[type=search],textarea{background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:7px 10px;min-width:0}
textarea{width:100%;resize:vertical;min-height:64px}

/* Mise en page */
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100% - 56px)}
nav.side{border-right:1px solid var(--line);padding-inline:12px;padding-block:16px;display:flex;flex-direction:column;gap:2px;background:var(--surface)}
nav.side button{display:flex;align-items:center;justify-content:space-between;gap:8px;border:0;background:transparent;text-align:left;padding:9px 12px;border-radius:8px;color:var(--muted);font-weight:600}
nav.side button:hover{background:var(--sunk);color:var(--fg)}
nav.side button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.navsep{height:1px;background:var(--line);margin:10px 4px}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center}
main{padding-inline:24px;padding-block:24px 64px;min-width:0;display:flex;flex-direction:column;gap:20px;max-width:1240px;width:100%}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  nav.side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding-block:8px}
  nav.side button{white-space:nowrap}
  .navsep{display:none}
  main{padding-inline:16px}
}

/* Composants */
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head .sub{color:var(--muted);margin-top:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);padding:8px 14px;border-radius:8px;font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.sec{background:var(--surface);color:var(--fg);border-color:var(--line-2)}
.btn.sec:hover{background:var(--sunk)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{background:var(--surface);color:var(--bad);border-color:var(--line-2)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.card > .ch{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.card > .cb{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:980px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--f-mono);font-size:26px;font-weight:600;line-height:1.2}
.kpi span{font-size:12px;color:var(--muted);font-weight:600}
.kpi.bad b{color:var(--bad)} .kpi.warn b{color:var(--warn)} .kpi.ok b{color:var(--ok)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.p-bad{background:var(--bad-soft);color:var(--bad)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-ok{background:var(--ok-soft);color:var(--ok)}
.p-acc{background:var(--accent-soft);color:var(--accent)}
.cat{font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:2px 6px;border-radius:4px}
.cat-Manager{background:var(--c-man-soft);color:var(--c-man)} .cat-RH{background:var(--c-rh-soft);color:var(--c-rh)} .cat-Commercial{background:var(--c-com-soft);color:var(--c-com)} .cat-Admin,.cat-Evt{background:var(--c-ev-soft);color:var(--c-ev)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none;background:var(--line-2)}
.dot.vert{background:var(--ok)} .dot.orange{background:var(--warn)} .dot.rouge{background:var(--bad)}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .t{font-weight:700}
.li .s{font-size:12.5px;color:var(--muted)}
.li.click{cursor:pointer} .li.click:hover{background:var(--sunk)}
.empty{padding:18px 16px;color:var(--muted)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
tr:last-child td{border-bottom:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 14px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-color:var(--accent)}
.meta{display:flex;flex-wrap:wrap;gap:4px 18px;color:var(--muted);font-size:13px}
.meta b{color:var(--fg);font-weight:600}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;border:1px solid var(--line)}
.alert.orange{background:var(--warn-soft);border-color:transparent} .alert.rouge{background:var(--bad-soft);border-color:transparent}
.alert .dot{margin-top:6px}
.alert > div{flex:1;min-width:0}
.field{display:flex;flex-direction:column;gap:6px}
.field > label,.field > .lbl{font-weight:700;font-size:13px}
.req{color:var(--bad)}
.hint{font-size:12px;color:var(--muted);font-weight:500}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line-2);background:var(--surface);padding:6px 12px;border-radius:999px;font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.qrow{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.qrow .qh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qrow .qh input[type=text]{flex:1 1 220px}
.lock{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted);background:var(--sunk);padding:3px 8px;border-radius:6px}
.answers{display:grid;grid-template-columns:minmax(160px,38%) minmax(0,1fr);gap:0}
.answers > div{padding:10px 0;border-bottom:1px solid var(--line)}
.answers > div:nth-child(odd){color:var(--muted);font-weight:600;padding-right:16px}
@media (max-width:560px){.answers{grid-template-columns:minmax(0,1fr)}.answers > div:nth-child(odd){border-bottom:0;padding-bottom:0}}
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:980px){.split{grid-template-columns:minmax(0,1fr)}}
.ia{border:1px dashed var(--accent);background:var(--accent-soft)}
.ia .out{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13.5px}
.check{display:flex;gap:8px;align-items:center}

/* Calendrier (Gantt) */
.gantt{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.g-inner{min-width:calc(190px + var(--days) * 30px)}
.g-row{display:grid;grid-template-columns:190px minmax(0,1fr);border-bottom:1px solid var(--line)}
.g-row:last-child{border-bottom:0}
.g-name{padding:8px 12px;border-right:1px solid var(--line);position:sticky;left:0;background:var(--surface);z-index:2;min-width:0}
.g-name b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-name span{font-size:11.5px;color:var(--muted);white-space:nowrap}
.g-track{position:relative;height:auto;min-height:52px}
.g-days{display:grid;grid-template-columns:repeat(var(--days),30px);position:absolute;inset:0}
.g-days > i{border-right:1px solid var(--line);opacity:.55}
.g-days > i.we{background:var(--sunk);opacity:1}
.g-head .g-days{position:static}
.g-head .g-days > span{font-size:10.5px;text-align:center;padding:4px 0;color:var(--muted);font-family:var(--f-mono);border-right:1px solid var(--line);line-height:1.25}
.g-head .g-days > span.we{background:var(--sunk)}
.g-head .g-days > span.td{background:var(--accent);color:var(--on-accent);font-weight:600}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);z-index:1}
.g-item{position:absolute;height:20px;border-radius:5px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:4px;padding:0 6px;white-space:nowrap;overflow:hidden;border:0;z-index:1}
.g-bar{border:1.5px dashed currentColor;background:transparent}
.g-bar.Manager{color:var(--c-man);background:var(--c-man-soft)} .g-bar.RH{color:var(--c-rh);background:var(--c-rh-soft)} .g-bar.Commercial{color:var(--c-com);background:var(--c-com-soft)}
.g-bar.late{color:var(--bad);background:var(--bad-soft)}
.g-meet{color:var(--on-accent)}
.g-meet.Manager{background:var(--c-man)} .g-meet.RH{background:var(--c-rh)} .g-meet.Commercial{background:var(--c-com)}
.g-done{background:var(--ok-soft);color:var(--ok)}
.g-ev{background:var(--c-ev-soft);color:var(--c-ev)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:18px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}

/* Fenêtre modale et notifications */
.overlay{position:fixed;inset:0;background:rgba(10,18,28,.45);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto;display:flex;flex-direction:column}
.modal .mh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.modal .mb{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.mail{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px;cursor:pointer}
.mail:last-child{border-bottom:0}
.mail.unread{background:var(--accent-soft)}
.mail .ms{font-weight:700}
.mail.unread .ms::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:8px;vertical-align:middle}
.err{color:var(--bad);font-weight:600;font-size:13px}
.foot{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
@media (prefers-reduced-motion:no-preference){.btn,.li,nav.side button{transition:background .12s,border-color .12s,color .12s}}
</style>

</head>
<body>
<header class="top">
  <div class="brand"><div class="mark" aria-hidden="true">IT</div><div><b>Inov Team</b><span>Suivi de Mission</span></div></div>
  <div class="who"><label for="whoSel">Connecté en tant que</label><select id="whoSel"></select></div>
</header>
<div class="shell">
  <nav class="side" id="nav" aria-label="Navigation principale"></nav>
  <main id="view"></main>
</div>
<div id="modalRoot"></div>
<div id="toastRoot" role="status" aria-live="polite"></div>

<script>
(function(){
/* ---------- Dates ---------- */
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d) };
const add = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d) };
const diff = (a,b) => Math.round((parse(a)-parse(b))/864e5);
const T = iso(new Date());
const fmt = s => s ? parse(s).toLocaleDateString('fr-FR',{day:'numeric',month:'short'}) : '';
const fmtY = s => s ? parse(s).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'}) : '';
const fmtL = s => s ? parse(s).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}) : '';
const rel = s => { const n = diff(s,T); if(n===0) return "aujourd'hui"; if(n===1) return 'demain'; if(n===-1) return 'hier'; return n>0 ? 'dans '+n+' j' : 'il y a '+(-n)+' j' };
const uid = p => p+Math.random().toString(36).slice(2,10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- Règles de jalons (workflow fixe) ---------- */
const RULES = {
  Manager:{fixed:[[1,'tm1','J+1'],[7,'tm2','J+7'],[30,'tm3','J+30']], every:30, rec:'tm4'},
  RH:{fixed:[[30,'trh','J+30']], every:90, rec:'trh'},
  Commercial:{fixed:[[7,'tcom','J+7'],[30,'tcom','J+30'],[90,'tcom','J+90']], every:90, rec:'tcom'}
};
const CATS = ['Manager','RH','Commercial'];
const OPT_SAT = ['Très satisfaisant','Satisfaisant','Moyen','Insatisfaisant'];

/* ---------- Données d'exemple ---------- */
function seed(){
  const S = {version:3, lastSync:add(T,-1), users:[], collabs:[], missions:[], templates:[], followups:[], notifs:[], warnings:[], events:[], meetings:[], mails:[]};
  S.users = [
    {id:'u_gael',name:'Gaël',role:'Manager',email:'gael@inov-team.fr'},
    {id:'u_max',name:'Max',role:'Manager',email:'max@inov-team.fr'},
    {id:'u_lorine',name:'Lorine',role:'RH',email:'lorine@inov-team.fr'},
    {id:'u_alex',name:'Alexandre TORRE',role:'Commercial',email:'alexandre.torre@inov-team.fr'},
    {id:'u_admin',name:'Admin Inov',role:'Admin',email:'admin@inov-team.fr'}
  ];
  const q = (label,type,opts,req) => ({id:uid('q'),label,type,options:opts||[],required:!!req});
  const tpl = (fam,name,category,questions) => ({id:fam+'_v1',family:fam,version:1,name,category,system:true,active:true,published:true,questions});
  S.templates = [
    tpl('tm1','Premier jour','Manager',[q('Accueil client (locaux, matériel)','select',OPT_SAT,1),q('Accueil des équipes','select',OPT_SAT,1),q('Poste de travail opérationnel','bool',[],1),q('Points bloquants','text')]),
    tpl('tm2','Première semaine','Manager',[q('Intégration et communication côté client','select',OPT_SAT,1),q('Intégration et communication côté Inov','select',OPT_SAT,1),q('Tâches conformes à la présentation de la mission','bool',[],1),q('Difficultés rencontrées','text')]),

/* ---------- Moteur de rappels ---------- */
function genNotifs(S, m, silent){
  let n = 0;
  CATS.forEach(cat=>{
    const r = RULES[cat];
    r.fixed.forEach(([d,fam,lab])=>{
      const t = S.templates.find(x=>x.family===fam);
      S.notifs.push({id:uid('n'),missionId:m.id,collabId:m.collabId,category:cat,family:fam,label:lab+' '+(t?t.name:''),due:add(m.start,d),status:'pending'}); n++;
    });
  });
  return n;
}
function completeNotif(S, f){
  const cat = f.snapshot.category, fam = S.templates.find(t=>t.id===f.templateId)?.family;
  const pend = S.notifs.filter(n=>n.missionId===f.missionId && n.category===cat && n.status==='pending').sort((a,b)=>a.due<b.due?-1:1);
  const hit = pend.find(n=>n.family===fam) || pend[0];
  if(hit){ hit.status='done'; hit.doneAt=f.date; hit.followupId=f.id;
    S.meetings.filter(r=>r.notifId===hit.id).forEach(r=>r.followupId=f.id); }
  const m = S.missions.find(x=>x.id===f.missionId);
  const left = S.notifs.filter(n=>n.missionId===f.missionId && n.category===cat && n.status==='pending');
  if(!left.length && m && !(m.end && m.end < f.date)){
    const r = RULES[cat], t = S.templates.find(x=>x.family===r.rec);
    S.notifs.push({id:uid('n'),missionId:m.id,collabId:m.collabId,category:cat,family:r.rec,label:(cat==='Manager'?'Suivi régulier':'Suivi trimestriel'),due:add(f.date,r.every),status:'pending'});
  }
  return hit;
}
function recipients(S,n){
  const c = S.collabs.find(x=>x.id===n.collabId); if(!c) return [];
  if(n.category==='Manager') return [c.managerId];
  if(n.category==='Commercial') return [c.commercialId];
  return S.users.filter(u=>u.role==='RH').map(u=>u.id);
}
function mailTo(S,to,subject,body,date,kind){
  S.mails.unshift({id:uid('mail'),to:[...new Set(to)],subject,body,date:date||T,kind,readBy:[]});
  if(S.mails.length>250) S.mails.length=250;
}
function processNotifs(S){
  S.notifs.filter(n=>n.status==='pending').forEach(n=>{
    const m = S.missions.find(x=>x.id===n.missionId), c = S.collabs.find(x=>x.id===n.collabId);
    if(!m||!c) return;
    if(m.end && m.end < T){ n.status='cancelled'; return }
    if(n.due<=T && !n.sentAt){ n.sentAt=n.due; mailTo(S,recipients(S,n),'Suivi à réaliser : '+n.label+' · '+c.name,c.name+' ('+m.client+'). Le suivi '+n.category.toLowerCase()+' « '+n.label+' » est attendu pour le '+fmtY(n.due)+'.',n.due,'jalon') }
    const r = add(n.due,3);
    if(r<=T && !n.relanceAt){ n.relanceAt=r; mailTo(S,recipients(S,n),'Relance : '+n.label+' · '+c.name,'Ce suivi n\'est toujours pas complété. Échéance dépassée depuis le '+fmtY(n.due)+'.',r,'relance') }
  });
}

/* Calendrier */
function vCalendar(){
  const u = me(), start = add(T,-7), days = 42, sc = scope();
  const dayList = Array.from({length:days},(_,i)=>add(start,i));
  const idx = d => diff(d,start);
  const W = 30;
  const rowFor = c => {
    const items = [];
    const nots = CATS.map(cat=>S.notifs.filter(n=>n.collabId===c.id && n.category===cat && n.status==='pending' && (!ui.calMine || isMine(n))).sort((a,b)=>a.due<b.due?-1:1)[0]).filter(Boolean);
    nots.forEach(n=>{ const r = meetingFor(n);
      if(r){ if(r.date>=start && idx(r.date)<days) items.push({l:idx(r.date),w:1.6,cls:'g-meet '+n.category,txt:r.time,act:'meet',id:r.id,title:'RDV '+n.category+' : '+n.label+' le '+fmt(r.date)+' à '+r.time}); return }
      if(n.due<T){ items.push({l:idx(T),w:1.6,cls:'g-bar late',txt:'Retard',act:'plan',id:n.id,title:n.category+' : '+n.label+' en retard depuis le '+fmt(n.due)}); return }
      const a = idx(T), b = Math.min(idx(n.due), days-1); if(a>=days) return;
      items.push({l:a,w:Math.max(1.6,b-a+1),cls:'g-bar '+n.category,txt:n.category+' · '+n.label,act:'plan',id:n.id,title:'À planifier avant le '+fmt(n.due)+' : '+n.category+' '+n.label});
    });
    S.meetings.filter(r=>r.collabId===c.id && r.followupId && r.date>=start && r.date<T).forEach(r=>items.push({l:idx(r.date),w:1,cls:'g-done',txt:'✓',act:'viewF',id:r.followupId,title:'RDV réalisé'}));
    S.followups.filter(f=>f.collabId===c.id && f.date>=start && f.date<=T && (!ui.calMine || f.snapshot.category===myCat() || u.role==='Admin')).forEach(f=>items.push({l:idx(f.date),w:1,cls:'g-done',txt:'✓',act:'viewF',id:f.id,title:f.snapshot.category+' : '+f.snapshot.name+' réalisé le '+fmt(f.date)}));
    S.events.filter(e=>e.collabId===c.id && e.date>=start && idx(e.date)<days).forEach(e=>items.push({l:idx(e.date),w:1,cls:'g-ev',txt:'★',act:'open',id:c.id,title:e.title+' le '+fmt(e.date)}));
    // empilement simple pour éviter les chevauchements
    const lanes = []; items.sort((a,b)=>a.l-b.l).forEach(it=>{ let k = lanes.findIndex(end=>end<=it.l); if(k<0){ k=lanes.length; lanes.push(0) } lanes[k]=it.l+it.w+0.15; it.lane=k });
    const h = Math.max(52, 12 + lanes.length*24);
    return `<div class="g-row"><div class="g-name"><b>${esc(c.name)}</b><span>${esc(curMission(c)?.client||'')}</span></div>
      <div class="g-track" style="height:${h}px"><div class="g-days">${dayList.map(d=>`<i class="${[0,6].includes(parse(d).getDay())?'we':''}"></i>`).join('')}</div>
      <div class="g-today" style="left:${idx(T)*W+W/2}px"></div>
      ${items.map(it=>`<button class="g-item ${it.cls}" style="left:${it.l*W+2}px;width:${it.w*W-4}px;top:${8+it.lane*24}px" data-a="${it.act}" data-id="${it.id}" title="${esc(it.title)}" aria-label="${esc(it.title)}">${esc(it.txt)}</button>`).join('')}
      </div></div>` };
  const toPlan = S.notifs.filter(n=>n.status==='pending' && inScope(n.collabId) && isMine(n) && !meetingFor(n) && n.due<=add(T,35)).sort((a,b)=>a.due<b.due?-1:1);
  return `<div class="head"><div><h1>Calendrier</h1><p class="sub">Une barre en pointillés court d'aujourd'hui à la date limite tant que le suivi n'est pas planifié. Clique dessus pour planifier.</p></div>
    <div class="seg" role="group" aria-label="Filtre"><button data-a="calMine" data-v="1" aria-pressed="${ui.calMine}">${u.role==='Admin'?'Tous':'Mes jalons'}</button><button data-a="calMine" data-v="0" aria-pressed="${!ui.calMine}">Tous les rôles</button></div></div>
  <div class="legend"><span><i style="background:var(--c-man)"></i>Manager</span><span><i style="background:var(--c-rh)"></i>RH</span><span><i style="background:var(--c-com)"></i>Commercial</span><span><i style="border:1.5px dashed var(--muted)"></i>À planifier</span><span><i style="background:var(--bad-soft);border:1.5px dashed var(--bad)"></i>En retard</span><span><i style="background:var(--ok-soft)"></i>Réalisé</span><span><i style="background:var(--c-ev-soft)"></i>Événement spécial</span></div>
  <div class="gantt" style="--days:${days}"><div class="g-inner">

}
const closeModal = () => $('#modalRoot').innerHTML = '';
let toastT; function toast(msg){ $('#toastRoot').innerHTML = `<div class="toast">${esc(msg)}</div>`; clearTimeout(toastT); toastT = setTimeout(()=>$('#toastRoot').innerHTML='', 3600) }

function planModal(n){
  const c = collab(n.collabId), m = mission(n.missionId);

function icsFor(r){
  const c = collab(r.collabId), org = S.users.find(u=>u.id===r.organizerId);
  const dt = (r.date+'T'+r.time.replace(':','')+'00').replace(/-/g,'');
  const [h,mi] = r.time.split(':').map(Number); const endH = pad(h+1)+pad(mi);
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Inov Team//Suivi de Mission//FR','METHOD:REQUEST','BEGIN:VEVENT','UID:'+r.id+'@suivi.inov-team.fr','DTSTAMP:'+T.replace(/-/g,'')+'T080000','DTSTART;TZID=Europe/Paris:'+dt,'DTEND;TZID=Europe/Paris:'+r.date.replace(/-/g,'')+'T'+endH+'00','SUMMARY:'+r.title,'DESCRIPTION:Suivi de mission Inov Team','ORGANIZER;CN='+org.name+':mailto:'+org.email,'ATTENDEE;CN='+c.name+';RSVP=TRUE:mailto:'+c.email,'END:VEVENT','END:VCALENDAR'].join('\r\n');

/* ---------- Actions ---------- */
function startFollowup(collabId, missionId, family){
  const c = collab(collabId);
  const ms = S.missions.filter(m=>m.collabId===c.id && mStatus(m)!=='Terminée');
  const tpls = latestTemplates().filter(t=>t.active && canFill(t.category));
  const t = (family && tpls.find(x=>x.family===family)) || tpls[0];
  ui.draft = {collabId, missionId: missionId || ms[0]?.id, templateId: t?.id, answers:{}, comment:'', transcript:'', err:''};
  ui.view='followupNew'; render(); window.scrollTo(0,0);
}
const A = {
  go(d){ ui.view=d.v; closeModal(); render(); window.scrollTo(0,0) },
  open(d,el,e){ if(e) e.preventDefault(); ui.view='collab'; ui.collabId=d.id; ui.tab='synthese'; ui.fMission=''; ui.fCat=''; ui.fPeriod=''; closeModal(); render(); window.scrollTo(0,0) },

  ans(d){ const t = S.templates.find(x=>x.id===ui.draft.templateId), qq = t.questions.find(x=>x.id===d.q);
    let v = qq.type==='bool' ? d.v==='true' : d.v; ui.draft.answers[d.q] = ui.draft.answers[d.q]===v ? undefined : v; syncDraft(); render() },
  submitF(){
    syncDraft(); const d = ui.draft, t = S.templates.find(x=>x.id===d.templateId);
    const miss = t.questions.filter(qq=>qq.required && (d.answers[qq.id]===undefined || d.answers[qq.id]==='' ));
    if(miss.length){ d.err = 'À compléter : '+miss.map(x=>x.label).join(', '); return render() }
    const ans = {}; Object.entries(d.answers).forEach(([k,v])=>{ if(v!==undefined && v!=='') ans[k]=v });
    const f = {id:uid('f'),templateId:t.id,snapshot:{name:t.name,version:t.version,category:t.category,questions:JSON.parse(JSON.stringify(t.questions))},missionId:d.missionId,collabId:d.collabId,authorId:ui.me,date:T,answers:ans,comment:d.comment.trim(),locked:true};
    S.followups.push(f); completeNotif(S,f);
    const mt = meteoAnswer(f), c = collab(f.collabId);
    let extra = '';
    if(mt==='Orange' || mt==='Rouge'){
      const w = {id:uid('w'),collabId:c.id,scope:'client',level:mt.toLowerCase(),text:'Météo '+mt.toLowerCase()+' au suivi commercial. '+(f.comment||ans[t.questions.find(x=>/retour/i.test(x.label))?.id]||''),date:T,authorId:ui.me,open:true};
      S.warnings.push(w); mailTo(S,c.notified,'Alerte client : '+c.name,w.text,T,'warning'); extra=' Alerte envoyée à '+c.notified.length+' personne(s).';
    }
    processNotifs(S); save(); ui.followupId=f.id; ui.view='followupView'; ui.draft=null; render(); window.scrollTo(0,0); toast('Suivi validé et partagé.'+extra);
  },
  async prefill(){
    syncDraft(); const d = ui.draft, t = S.templates.find(x=>x.id===d.templateId);
    if(!d.transcript.trim()){ d.iaStatus='Colle d\'abord une transcription.'; return render() }
    d.iaStatus='Analyse en cours…'; render();
    const spec = t.questions.map(qq=>({id:qq.id,question:qq.label,type:qq.type,options:qq.type==='select'?qq.options:undefined}));
    const prompt = 'Tu aides un '+me().role.toLowerCase()+' d\'une ESN à remplir un questionnaire de suivi de mission à partir de la transcription d\'un appel.\n'
      +'Questionnaire (JSON) : '+JSON.stringify(spec)+'\n'
      +'Règles : pour type "select", la valeur doit être exactement une des options ; pour "bool", true ou false ; pour "text", une phrase courte et factuelle en français, sans tiret. Si l\'information est absente, mets null.\n'
      +'Réponds uniquement avec un objet JSON {"answers": {"<id>": valeur}, "comment": "synthèse en 2 phrases maximum de ce qu\'il faut retenir"}.\n\nTranscription :\n'+d.transcript.slice(0,20000);
    try{
      const r = await sampleFn.json(prompt,{modelTier:'default'});
      let n = 0;
      t.questions.forEach(qq=>{ let v = r?.answers?.[qq.id]; if(v===null||v===undefined) return;

        if(qq.type==='bool') v = v===true||v==='true'; if(qq.type==='text') v = String(v);
        d.answers[qq.id]=v; n++ });
      if(r?.comment && !d.comment) d.comment = String(r.comment);

    }catch(e){ d.iaStatus = e?.code==='not_granted'||e?.code==='sampling_disabled' ? 'L\'IA n\'est pas autorisée pour cette page.' : e?.code==='rate_limited' ? 'Trop de demandes, réessaie dans un moment.' : 'L\'IA n\'a pas pu remplir le questionnaire. Réessaie ou remplis à la main.' }

  },
  async summarize(){

  },
  addWarn(){ const c = collab(ui.collabId);

  saveWarn(){ const c = collab(ui.collabId), text = $('#wText').value.trim(); if(!text){ $('#mErr').textContent='Décris l\'alerte.'; return }
    const w = {id:uid('w'),collabId:c.id,scope:$('#wScope [aria-pressed="true"]').dataset.v,level:$('#wLevel [aria-pressed="true"]').dataset.v,text,date:T,authorId:ui.me,open:true};

      `<button class="btn sec" data-a="closeModal">Annuler</button><button class="btn" data-a="saveEvent">Ajouter</button>`) },
  saveEvent(){ const c = collab(ui.collabId), title = $('#eTitle').value.trim(), date = $('#eDate').value; if(!title||!date){ $('#mErr').textContent='Indique un intitulé et une date.'; return }
    S.events.push({id:uid('e'),collabId:c.id,date,title,desc:$('#eDesc').value.trim()}); mailTo(S,c.notified,'Événement spécial : '+title+' · '+c.name,'Prévu le '+fmtY(date)+'.',T,'event'); save(); closeModal(); render(); toast('Événement ajouté.') },
  newMission(){ modal('Nouvelle mission', `<div class="field"><label for="nClient">Client</label><input type="text" id="nClient" placeholder="Ex. Amadeus"></div>
      <div class="grid g2"><div class="field"><label for="nStart">Début</label><input type="date" id="nStart" value="${add(T,7)}"></div><div class="field"><label for="nEnd">Fin <span class="hint">facultatif</span></label><input type="date" id="nEnd"></div></div>
      <div class="field"><label for="nDesc">Description</label><textarea id="nDesc" rows="3"></textarea></div>
      <p class="small muted">Les rappels J+1, J+7 et J+30 (manager), J+30 (RH) et J+7, J+30, J+90 (commercial) seront planifiés automatiquement.</p><span class="err" id="mErr"></span>`,
      `<button class="btn sec" data-a="closeModal">Annuler</button><button class="btn" data-a="saveMission">Créer la mission</button>`) },
  saveMission(){ const client = $('#nClient').value.trim(), start = $('#nStart').value, end = $('#nEnd').value;
    if(!client||!start){ $('#mErr').textContent='Le client et la date de début sont obligatoires.'; return }
    if(end && end<start){ $('#mErr').textContent='La date de fin doit suivre la date de début.'; return }
    const m = {id:uid('m'),collabId:ui.collabId,client,start,end,desc:$('#nDesc').value.trim()}; S.missions.push(m);
    const n = genNotifs(S,m); processNotifs(S); save(); closeModal(); ui.tab='missions'; render(); toast('Mission créée ('+mStatus(m)+'), '+n+' rappels planifiés.') },
  plan(d){ const n = S.notifs.find(x=>x.id===d.id); if(n) planModal(n) },
  savePlan(d){ const n = S.notifs.find(x=>x.id===d.id), date = $('#pDate').value, time = $('#pTime').value||'12:30'; if(!date) return;
    const r = {id:uid('r'),collabId:n.collabId,missionId:n.missionId,notifId:n.id,date,time,organizerId:ui.me,title:$('#pTitle').value.trim()||n.label};
    S.meetings.push(r); save(); render(); meetModal(r); toast('Rendez-vous planifié le '+fmt(date)+' à '+time+'.') },
  meet(d){ const r = S.meetings.find(x=>x.id===d.id); if(r) meetModal(r) },
  async ics(d){ const r = S.meetings.find(x=>x.id===d.id); if(!r||!downloads) return;
    try{ await downloads.save({filename:'suivi-'+collab(r.collabId).name.toLowerCase().replace(/[^a-z]+/g,'-')+'-'+r.date+'.ics', data:icsFor(r)}); toast('Invitation prête à ouvrir dans Outlook.') }
    catch(e){ toast(e?.code==='declined'?'Téléchargement annulé.':e?.code==='rejected_extension'?'Le format .ics est refusé dans cette vue.':'Le téléchargement n\'a pas pu démarrer.') } },
  calMine(d){ ui.calMine = d.v==='1'; saveUi(); render() },
  readMail(d){ const m = S.mails.find(x=>x.id===d.id); if(!m.readBy.includes(ui.me)) m.readBy.push(ui.me); save(); render() },
  readAll(){ S.mails.forEach(m=>{ if(m.to.includes(ui.me) && !m.readBy.includes(ui.me)) m.readBy.push(ui.me) }); save(); render() },
  sync(){ let created = 0;
    if(!S.collabs.some(c=>c.ext==='BD-1066')){ S.collabs.push({id:uid('c'),ext:'BD-1066',name:'Nora Haddad',email:'n.haddad@inov-team.fr',poste:'Ingénieure Cybersécurité',managerId:'u_gael',commercialId:'u_alex',notified:['u_gael','u_alex','u_lorine']}); created=1 }
    S.lastSync = T; save(); render(); toast('Synchronisation terminée : '+created+' créé(s), '+(S.collabs.length-created)+' mis à jour, managers associés.') },
  toggleTpl(d,el){ const t = S.templates.find(x=>x.id===d.id); t.active = el.checked; save(); toast(t.active?'Template activé.':'Template désactivé, il n\'est plus sélectionnable.') },
  newTpl(){ ui.tplDraft = {baseId:null,name:'',category:'Manager',questions:[{id:uid('q'),label:'',type:'text',options:[],required:false}]}; ui.view='templateEdit'; render() },
  editTpl(d){ const t = S.templates.find(x=>x.id===d.id); ui.tplDraft = {baseId:t.id,family:t.family,name:t.name,category:t.category,questions:JSON.parse(JSON.stringify(t.questions))}; ui.view='templateEdit'; render() },
  tqAdd(d){ syncTpl(); ui.tplDraft.questions.push({id:uid('q'),label:'',type:d.v,options:d.v==='select'?['Option 1','Option 2']:[],required:false}); render() },
  tqDel(d){ syncTpl(); ui.tplDraft.questions.splice(Number(d.i),1); render() },
  tqMove(d){ syncTpl(); const q = ui.tplDraft.questions, i = Number(d.i), j = i+Number(d.d); [q[i],q[j]]=[q[j],q[i]]; render() },
  saveTpl(){ syncTpl(); const d = ui.tplDraft;
    if(!d.name.trim()){ d.err='Donne un nom au template.'; return render() }
    if(d.questions.some(qq=>!qq.label.trim())){ d.err='Chaque question a besoin d\'un intitulé.'; return render() }
    if(d.questions.some(qq=>qq.type==='select' && qq.options.length<2)){ d.err='Un choix unique demande au moins deux options.'; return render() }
    if(d.baseId){ const base = S.templates.find(t=>t.id===d.baseId); base.active=false;
      const v = Math.max(...S.templates.filter(t=>t.family===base.family).map(t=>t.version))+1;
      S.templates.push({id:base.family+'_v'+v,family:base.family,version:v,name:d.name.trim(),category:base.category,system:base.system,active:true,published:true,questions:d.questions}); toast('Version '+v+' publiée.') }
    else { const fam = uid('tf'); S.templates.push({id:fam+'_v1',family:fam,version:1,name:d.name.trim(),category:d.category,system:false,active:true,published:true,questions:d.questions}); toast('Template publié.') }
    save(); ui.view='templates'; ui.tplDraft=null; render() },
  notified(d,el){ const c = collab(ui.collabId); c.notified = el.checked ? [...new Set([...c.notified,d.id])] : c.notified.filter(x=>x!==d.id); save(); toast('Liste de notification mise à jour.') },
  reset(){ modal('Réinitialiser la démo', '<p>Les suivis, missions et templates créés pendant la démo seront effacés de ce navigateur.</p>', '<button class="btn sec" data-a="closeModal">Annuler</button><button class="btn danger" data-a="doReset">Réinitialiser</button>') },
  doReset(){ S = buildSeedHistory(seed()); processNotifs(S); save(); closeModal(); ui.view='dashboard'; render(); toast('Démo réinitialisée.') },
  closeModal(){ closeModal() },
  closeModalBg(d,el,e){ if(e.target===el) closeModal() }
};
function syncDraft(){ const d = ui.draft; if(!d) return;
  document.querySelectorAll('[data-q]').forEach(el=>{ if(el.tagName==='TEXTAREA') d.answers[el.dataset.q]=el.value });
  const c = $('#dComment'); if(c) d.comment=c.value; const ia = $('#iaText'); if(ia) d.transcript=ia.value; }
function syncTpl(){ const d = ui.tplDraft; if(!d) return; const n = $('#tName'); if(n) d.name=n.value; const c = $('#tCat'); if(c && !c.disabled) d.category=c.value;
  document.querySelectorAll('[data-tq]').forEach(el=>{ const q = d.questions[Number(el.dataset.tq)]; const k = el.dataset.k;
    if(k==='label') q.label=el.value; if(k==='type') q.type=el.value; if(k==='required') q.required=el.checked; if(k==='options') q.options=el.value.split('\n').map(s=>s.trim()).filter(Boolean) }) }

document.addEventListener('click', e=>{
  const el = e.target.closest('[data-a]'); if(!el) return;
  if(el.type==='checkbox') return;
  const fn = A[el.dataset.a]; if(fn){ fn(el.dataset, el, e) }
});
document.addEventListener('change', e=>{
  const el = e.target;
  if(el.id==='whoSel'){ ui.me = el.value; saveUi(); if(['followupNew','templateEdit','followupView'].includes(ui.view) || (ui.view==='collab' && !inScope(ui.collabId)) || (ui.view==='templates' && me().role!=='Admin')) ui.view='dashboard'; render(); return }
  if(el.type==='checkbox' && el.dataset.a && A[el.dataset.a]) { A[el.dataset.a](el.dataset, el, e); return }
  if(el.id==='fMission'){ ui.fMission=el.value; render() }
  if(el.id==='fCat'){ ui.fCat=el.value; render() }
  if(el.id==='fPeriod'){ ui.fPeriod=el.value; render() }
  if(el.id==='dMission'){ syncDraft(); ui.draft.missionId=el.value; render() }
  if(el.id==='dTpl'){ syncDraft(); ui.draft.templateId=el.value; ui.draft.answers={}; ui.draft.err=''; render() }
  if(el.dataset.k==='type'){ syncTpl(); const q = ui.tplDraft.questions[Number(el.dataset.tq)]; if(q.type==='select' && !q.options.length) q.options=['Option 1','Option 2']; render() }
  if(el.id==='iaFile' && el.files[0]){ const r = new FileReader(); r.onload = () => { syncDraft(); ui.draft.transcript = String(r.result).slice(0,40000); ui.draft.iaStatus='Fichier chargé : '+el.files[0].name; render() }; r.readAsText(el.files[0]) }
});
document.addEventListener('input', e=>{
  if(e.target.id==='search'){ ui.search = e.target.value; const pos = e.target.selectionStart; render(); const s = $('#search'); if(s){ s.focus(); s.setSelectionRange(pos,pos) } }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && $('#modalRoot').innerHTML) closeModal() });

render();
})();
</script>

</body>
</html>
