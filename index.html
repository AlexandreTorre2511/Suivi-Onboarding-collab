<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Prototype de l'application Suivi de Mission Inov Team Group : suivi des collaborateurs en mission par les managers, les RH et les commerciaux.">
<link rel="icon" type="image/webp" href="logo-inov-team.webp">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{height:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Suivi de Mission Inov</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barre latérale de marque (logo, navigation, profil) + espace de travail avec barre supérieure. Identité Inov Team : dégradé bleu, violet, magenta et soleil en traits arrondis */
:root{
  --brand-1:#0644FD; --brand-2:#824FD2; --brand-3:#C23BAF;
  --grad:linear-gradient(105deg,#0644FD 0%,#5B4BE6 45%,#9A47CC 75%,#C23BAF 100%);
  --bg:#F4F5FB; --surface:#FFFFFF; --sunk:#EEF0F8; --line:#E3E6F1; --line-2:#CDD2E4;
  --fg:#11163A; --muted:#5D6488; --faint:#8A90B0;
  --accent:#2445F4; --accent-2:#1531D2; --accent-soft:#EBEFFF; --on-accent:#FFFFFF;
  --ok:#1E8C5A; --ok-soft:#E1F5EB; --warn:#B26700; --warn-soft:#FFF1DA; --bad:#D0263C; --bad-soft:#FDE6E9;
  --c-man:#2445F4; --c-rh:#0B8E9C; --c-com:#8048D0; --c-ev:#C23BAF;
  --c-man-soft:#EBEFFF; --c-rh-soft:#DFF5F7; --c-com-soft:#F1EAFC; --c-ev-soft:#FBE7F7;
  --side:#FFFFFF; --logo-c:block; --logo-w:none;
  --f-display:"Quicksand","Plus Jakarta Sans",system-ui,sans-serif;
  --f-ui:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px; --r-sm:10px;
  --shadow:0 1px 2px rgba(17,22,58,.05),0 8px 24px -12px rgba(17,22,58,.12);
  --shadow-lg:0 24px 60px -20px rgba(17,22,58,.35);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A0D1C; --surface:#121630; --sunk:#1A1F3C; --line:#242A4B; --line-2:#323962;
  --fg:#E9EBF8; --muted:#A0A6CA; --faint:#7279A0;
  --accent:#7E93FF; --accent-2:#A5B3FF; --accent-soft:#1C2455; --on-accent:#0A0D1C;
  --ok:#5ED39A; --ok-soft:#12321F; --warn:#F4B860; --warn-soft:#382711; --bad:#FF8A96; --bad-soft:#3D1620;
  --c-man:#7E93FF; --c-rh:#4FD0DC; --c-com:#B996F5; --c-ev:#F08ADF;
  --c-man-soft:#1C2455; --c-rh-soft:#0E3036; --c-com-soft:#2A1F48; --c-ev-soft:#3A173A;
  --side:#0E1228; --logo-c:none; --logo-w:block;
  --shadow:0 1px 2px rgba(0,0,0,.35); --shadow-lg:0 24px 60px -20px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0D1C; --surface:#121630; --sunk:#1A1F3C; --line:#242A4B; --line-2:#323962;
  --fg:#E9EBF8; --muted:#A0A6CA; --faint:#7279A0;
  --accent:#7E93FF; --accent-2:#A5B3FF; --accent-soft:#1C2455; --on-accent:#0A0D1C;
  --ok:#5ED39A; --ok-soft:#12321F; --warn:#F4B860; --warn-soft:#382711; --bad:#FF8A96; --bad-soft:#3D1620;
  --c-man:#7E93FF; --c-rh:#4FD0DC; --c-com:#B996F5; --c-ev:#F08ADF;
  --c-man-soft:#1C2455; --c-rh-soft:#0E3036; --c-com-soft:#2A1F48; --c-ev-soft:#3A173A;
  --side:#0E1228; --logo-c:none; --logo-w:block;
  --shadow:0 1px 2px rgba(0,0,0,.35); --shadow-lg:0 24px 60px -20px rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-size:26px;font-weight:700;letter-spacing:-.01em}
h2{font-family:var(--f-display);font-size:17px;font-weight:700}
h3{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--faint)}
p{margin:0}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Structure */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;height:100dvh;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding-inline:16px;padding-block:20px 16px;gap:18px;z-index:10}
.logo{display:block;padding:0 6px}
.logo img{width:176px;height:auto}
.logo .lc{display:var(--logo-c)} .logo .lw{display:var(--logo-w)}
.side-tag{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:0 8px;margin-top:-6px}
nav.nav{display:flex;flex-direction:column;gap:2px}
nav.nav button{position:relative;display:flex;align-items:center;gap:12px;border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:600}
nav.nav button:hover{background:var(--sunk);color:var(--fg)}
nav.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
nav.nav button[aria-current="page"]::before{content:"";position:absolute;left:-16px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--grad)}
nav.nav .lbl{flex:1}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--grad);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.me-card{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.me-card b{display:block;font-size:13px;line-height:1.2}
.me-card > div > span{font-size:11.5px;color:var(--muted)}
.side-link{border:0;background:transparent;color:var(--faint);font-size:12px;font-weight:600;display:flex;gap:8px;align-items:center;padding:4px 8px}
.side-link:hover{color:var(--fg)}
.work{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-inline:32px;padding-block:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.crumb{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:600;font-size:13px;min-width:0}
.crumb b{color:var(--fg)}
.top-r{display:flex;align-items:center;gap:10px}
.iconbtn{position:relative;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.iconbtn:hover{color:var(--fg);border-color:var(--line-2)}
.iconbtn .badge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;font-size:10px;padding:0 5px}
.who{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:3px 4px 3px 4px}
.who select{border:0;background:transparent;font-weight:600;padding:6px 4px;max-width:230px}
main{padding-inline:32px;padding-block:28px 72px;display:flex;flex-direction:column;gap:22px;max-width:1320px;width:100%}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding-block:12px;gap:10px;border-right:0;border-bottom:1px solid var(--line)}
  .logo img{width:104px}
  .side-tag,.side-foot{display:none}
  nav.nav{flex-direction:row;overflow-x:auto;width:100%;order:3}
  nav.nav button{white-space:nowrap;padding:8px 12px}
  nav.nav button[aria-current="page"]::before{display:none}
  .top{padding-inline:16px;position:static}
  .crumb{display:none}
  .top-r{width:100%;justify-content:space-between}
  main{padding-inline:16px;padding-block:20px 56px}
}

/* Avatars */
.av{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;letter-spacing:.02em;font-family:var(--f-ui)}
.av.sm{width:28px;height:28px;font-size:11px}
.av.lg{width:64px;height:64px;font-size:22px;font-family:var(--f-display)}
.av.h0{background:linear-gradient(135deg,#0644FD,#5B4BE6)} .av.h1{background:linear-gradient(135deg,#5B4BE6,#9A47CC)} .av.h2{background:linear-gradient(135deg,#9A47CC,#C23BAF)}
.av.h3{background:linear-gradient(135deg,#0B8E9C,#2445F4)} .av.h4{background:linear-gradient(135deg,#C23BAF,#E0607E)} .av.h5{background:linear-gradient(135deg,#2445F4,#0B8E9C)}
.person{display:flex;align-items:center;gap:12px;min-width:0}
.person > div{min-width:0}
.person b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Composants */
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head .sub{color:var(--muted);margin-top:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);padding:9px 16px;border-radius:10px;font-weight:700;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;box-shadow:0 1px 2px rgba(17,22,58,.12)}
.btn:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.grad{background:var(--grad);border-color:transparent;color:#fff}
.btn.grad:hover{filter:brightness(1.08)}
.btn.sec{background:var(--surface);color:var(--fg);border-color:var(--line-2);box-shadow:none}
.btn.sec:hover{background:var(--sunk)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:10px;box-shadow:none}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{background:var(--surface);color:var(--bad);border-color:var(--line-2);box-shadow:none}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.back{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--muted);font-weight:600;padding:0}
.back:hover{color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0;box-shadow:var(--shadow)}
.card > .ch{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.card > .cb{padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);align-items:start}
@media (max-width:1100px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-main{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}

/* Bandeau d'accueil */
.hero{position:relative;overflow:hidden;border-radius:18px;background:var(--grad);color:#fff;padding:28px 32px;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;box-shadow:var(--shadow-lg)}
.hero h1{font-size:30px;color:#fff}
.hero p{color:rgba(255,255,255,.88);max-width:560px;margin-top:6px}
.hero .actions{position:relative;z-index:1}
.hero .btn.sec{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35);color:#fff}
.hero .btn.sec:hover{background:rgba(255,255,255,.24)}
.hero .btn.white{background:#fff;color:#2A2FB8;border-color:#fff}
.hero .sun{position:absolute;right:-60px;top:50%;transform:translateY(-50%);width:340px;height:340px;opacity:.22;pointer-events:none}
.hero > div{position:relative;z-index:1}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.85}

/* Indicateurs */
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);min-width:0}
.kpi .kt{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:12.5px;font-weight:600}
.kpi .ki{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.kpi b{font-family:var(--f-display);font-size:32px;font-weight:700;line-height:1;letter-spacing:-.02em}
.kpi .kf{font-size:12px;color:var(--muted)}
.kpi.bad .ki{background:var(--bad-soft);color:var(--bad)} .kpi.bad b{color:var(--bad)}
.kpi.warn .ki{background:var(--warn-soft);color:var(--warn)}
.kpi.ok .ki{background:var(--ok-soft);color:var(--ok)}
.bar{height:6px;border-radius:999px;background:var(--sunk);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:inherit;background:var(--grad)}
.kpi.mini{padding:14px 16px;gap:6px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.p-bad{background:var(--bad-soft);color:var(--bad)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-ok{background:var(--ok-soft);color:var(--ok)} .p-acc{background:var(--accent-soft);color:var(--accent)}
.p-ev{background:var(--c-ev-soft);color:var(--c-ev)}
.cat{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:3px 8px;border-radius:6px;vertical-align:middle}
.cat::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.cat-Manager{background:var(--c-man-soft);color:var(--c-man)} .cat-RH{background:var(--c-rh-soft);color:var(--c-rh)} .cat-Commercial{background:var(--c-com-soft);color:var(--c-com)} .cat-Admin,.cat-Evt{background:var(--c-ev-soft);color:var(--c-ev)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none;background:var(--line-2);box-shadow:0 0 0 3px var(--surface)}
.dot.vert{background:var(--ok)} .dot.orange{background:var(--warn)} .dot.rouge{background:var(--bad)}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .t{font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.li .s{font-size:12.5px;color:var(--muted)}
.li.click{cursor:pointer} .li.click:hover{background:var(--sunk)}
.li .person{align-items:flex-start}
.empty{padding:22px 20px;color:var(--muted)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
tbody tr:last-child td{border-bottom:0}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:transparent;padding:12px 14px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected="true"]{color:var(--accent);border-image:var(--grad) 1;border-bottom:2px solid}
.meta{display:flex;flex-wrap:wrap;gap:6px 20px;color:var(--muted);font-size:13px}
.meta b{color:var(--fg);font-weight:600}
.profile{display:flex;gap:18px;align-items:center;min-width:0}
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.alert.orange{background:var(--warn-soft);border-color:transparent} .alert.rouge{background:var(--bad-soft);border-color:transparent}
.alert .dot{margin-top:6px;box-shadow:none}
.alert > div{flex:1;min-width:0}
.field{display:flex;flex-direction:column;gap:7px}
.field > label,.field > .lbl{font-weight:700;font-size:13px}
.req{color:var(--bad)}
.hint{font-size:12px;color:var(--muted);font-weight:500}
select,input[type=text],input[type=date],input[type=time],input[type=search],textarea{background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:9px 12px;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{width:100%;resize:vertical;min-height:64px}
.search{position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:12px;color:var(--faint)}
.search input{padding-left:38px;width:280px;max-width:100%}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line-2);background:var(--surface);padding:7px 14px;border-radius:999px;font-weight:600;font-size:13px}
.seg button:hover{border-color:var(--accent)}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.qrow{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.qrow .qh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qrow .qh input[type=text]{flex:1 1 220px}
.lock{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted);background:var(--sunk);padding:5px 10px;border-radius:8px}
.answers{display:grid;grid-template-columns:minmax(160px,38%) minmax(0,1fr)}
.answers > div{padding:12px 0;border-bottom:1px solid var(--line)}
.answers > div:nth-child(odd){color:var(--muted);font-weight:600;padding-right:16px}
@media (max-width:560px){.answers{grid-template-columns:minmax(0,1fr)}.answers > div:nth-child(odd){border-bottom:0;padding-bottom:0}}
.split{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
@media (max-width:1100px){.split{grid-template-columns:minmax(0,1fr)}}
.ia{position:relative;border:1px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--grad) border-box}
.ia .ch h2{display:flex;align-items:center;gap:8px}
.ia .spark{width:26px;height:26px;border-radius:8px;background:var(--grad);display:grid;place-items:center;color:#fff}
.ia .out{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13.5px}
.check{display:flex;gap:8px;align-items:center}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}

/* Calendrier */
.gantt{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
.g-inner{min-width:calc(210px + var(--days) * 30px)}
.g-row{display:grid;grid-template-columns:210px minmax(0,1fr);border-bottom:1px solid var(--line)}
.g-row:last-child{border-bottom:0}
.g-name{padding:10px 14px;border-right:1px solid var(--line);position:sticky;left:0;background:var(--surface);z-index:2;min-width:0;display:flex;gap:10px;align-items:center}
.g-name > div{min-width:0}
.g-name b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-name > div > span{font-size:11.5px;color:var(--muted);white-space:nowrap}
.g-track{position:relative;min-height:56px}
.g-days{display:grid;grid-template-columns:repeat(var(--days),30px);position:absolute;inset:0}
.g-days > i{border-right:1px solid var(--line);opacity:.6}
.g-days > i.we{background:var(--sunk);opacity:1}
.g-head .g-days{position:static}
.g-head .g-days > span{font-size:10.5px;text-align:center;padding:6px 0;color:var(--muted);font-family:var(--f-mono);border-right:1px solid var(--line);line-height:1.3}
.g-head .g-days > span.we{background:var(--sunk)}
.g-head .g-days > span.td{background:var(--grad);color:#fff;font-weight:600}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--brand-2);z-index:1}
.g-item{position:absolute;height:20px;border-radius:6px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:4px;padding:0 7px;white-space:nowrap;overflow:hidden;border:0;z-index:1}
.g-bar{border:1.5px dashed currentColor;background:transparent}
.g-bar.Manager{color:var(--c-man);background:var(--c-man-soft)} .g-bar.RH{color:var(--c-rh);background:var(--c-rh-soft)} .g-bar.Commercial{color:var(--c-com);background:var(--c-com-soft)}
.g-bar.late{color:var(--bad);background:var(--bad-soft)}
.g-meet{color:#fff}
.g-meet.Manager{background:var(--c-man)} .g-meet.RH{background:var(--c-rh)} .g-meet.Commercial{background:var(--c-com)}
.g-done{background:var(--ok-soft);color:var(--ok)}
.g-ev{background:var(--c-ev-soft);color:var(--c-ev)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:18px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}

/* Fenêtre modale, toast, emails */
.overlay{position:fixed;inset:0;background:rgba(10,13,28,.5);backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:18px;box-shadow:var(--shadow-lg);width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto;display:flex;flex-direction:column;border:1px solid var(--line)}
.modal .mh{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.modal .mb{padding:18px 22px;display:flex;flex-direction:column;gap:14px}
.modal .mf{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;background:var(--bg);border-radius:0 0 18px 18px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;z-index:60;max-width:calc(100% - 32px);box-shadow:var(--shadow-lg);display:flex;gap:10px;align-items:center}
.toast::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--grad);flex:none}
.mail{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px;cursor:pointer}
.mail:hover{background:var(--sunk)}
.mail:last-child{border-bottom:0}
.mail.unread{background:var(--accent-soft)}
.mail .ms{font-weight:700}
.mail.unread .ms::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--grad);margin-right:8px;vertical-align:middle}
.err{color:var(--bad);font-weight:600;font-size:13px}
.foot{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.signature{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--faint);font-size:12px;padding-top:8px}
@media (prefers-reduced-motion:no-preference){.btn,.li,nav.nav button,.mail,tr.click td,.seg button{transition:background .15s,border-color .15s,color .15s,filter .15s}}
</style>

/* ---------- Dates ---------- */
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d) };
const add = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d) };
const diff = (a,b) => Math.round((parse(a)-parse(b))/864e5);
const T = iso(new Date());
const fmt = s => s ? parse(s).toLocaleDateString('fr-FR',{day:'numeric',month:'short'}) : '';
const fmtY = s => s ? parse(s).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'}) : '';
const fmtL = s => s ? parse(s).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}) : '';
const rel = s => { const n = diff(s,T); if(n===0) return "aujourd'hui"; if(n===1) return 'demain'; if(n===-1) return 'hier'; return n>0 ? 'dans '+n+' j' : 'il y a '+(-n)+' j' };

function buildSeedHistory(S){

  const sf = (mid, fam, author, off, vals, comment) => {
    const m = M(mid), t = S.templates.find(x=>x.family===fam);
    const f = {id:uid('f'),templateId:t.id,snapshot:{name:t.name,version:t.version,category:t.category,questions:t.questions},missionId:mid,collabId:m.collabId,authorId:author,date:add(T,off),answers:ans(fam,vals),comment:comment||'',locked:true};
    S.followups.push(f); completeNotif(S,f);
  };
  ['m1','m2','m4','m6'].forEach(id=>genNotifs(S,M(id),true));
  // m3 et m5 : missions anciennes reprises dans l'outil avec le prochain jalon de chaque rôle

  pend('m3','RH','trh',-4,'Suivi trimestriel');

  // Historique
  sf('m1','tm1','u_gael',-15,['Très satisfaisant','Très satisfaisant',true,''],'Bon accueil, badge et poste prêts dès le premier jour.');

  sf('m2','tm1','u_gael',-99,['Très satisfaisant','Satisfaisant',true,''],'');

  sf('m2','tm3','u_gael',-70,['Très satisfaisant','Très satisfaisant',true,'',''],'Très autonome sur les pipelines.');
  sf('m2','trh','u_lorine',-69,['Très satisfaisant','Se voit évoluer vers un rôle de lead data.',true,true,''],'');
  sf('m2','tcom','u_alex',-70,['Client','Vert','Lead Data très content, parle de prolonger.','Excellent','Bon','Prolongation probable en janvier.','',''],'');
  sf('m2','tm4','u_gael',-38,['A repris le pilotage de la migration Airflow, hors périmètre initial.','Très satisfaisant',true,false,''],'');
  sf('m2','tcom','u_alex',-10,['Les deux','Vert','Le client souligne la qualité de la migration Airflow.','Excellent','Excellent','Extension de périmètre possible sur le lot 2.',true,'Besoin d\'un second Data Engineer en janvier.'],'Préparer une revalorisation du TJ au renouvellement.');

  sf('m3','tm4','u_max',-24,['Run stable, automatisations livrées.','Satisfaisant',true,false,'Point client à caler'],'Le client évoque une réinternalisation de l\'équipe en janvier.');

  ];

}

/* ---------- Moteur de rappels ---------- */
function genNotifs(S, m, silent){
  let n = 0;
  CATS.forEach(cat=>{
    const r = RULES[cat];
    r.fixed.forEach(([d,fam,lab])=>{
      const t = S.templates.find(x=>x.family===fam);
      S.notifs.push({id:uid('n'),missionId:m.id,collabId:m.collabId,category:cat,family:fam,label:lab+' '+(t?t.name:''),due:add(m.start,d),status:'pending'}); n++;
    });
  });
  return n;
}
function completeNotif(S, f){
  const cat = f.snapshot.category, fam = S.templates.find(t=>t.id===f.templateId)?.family;
  const pend = S.notifs.filter(n=>n.missionId===f.missionId && n.category===cat && n.status==='pending').sort((a,b)=>a.due<b.due?-1:1);
  const hit = pend.find(n=>n.family===fam) || pend[0];
  if(hit){ hit.status='done'; hit.doneAt=f.date; hit.followupId=f.id;
    S.meetings.filter(r=>r.notifId===hit.id).forEach(r=>r.followupId=f.id); }
  const m = S.missions.find(x=>x.id===f.missionId);
  const left = S.notifs.filter(n=>n.missionId===f.missionId && n.category===cat && n.status==='pending');
  if(!left.length && m && !(m.end && m.end < f.date)){
    const r = RULES[cat], t = S.templates.find(x=>x.family===r.rec);
    S.notifs.push({id:uid('n'),missionId:m.id,collabId:m.collabId,category:cat,family:r.rec,label:(cat==='Manager'?'Suivi régulier':'Suivi trimestriel'),due:add(f.date,r.every),status:'pending'});
  }
  return hit;
}
function recipients(S,n){
  const c = S.collabs.find(x=>x.id===n.collabId); if(!c) return [];
  if(n.category==='Manager') return [c.managerId];
  if(n.category==='Commercial') return [c.commercialId];
  return S.users.filter(u=>u.role==='RH').map(u=>u.id);
}
function mailTo(S,to,subject,body,date,kind){
  S.mails.unshift({id:uid('mail'),to:[...new Set(to)],subject,body,date:date||T,kind,readBy:[]});
  if(S.mails.length>250) S.mails.length=250;
}
function processNotifs(S){
  S.notifs.filter(n=>n.status==='pending').forEach(n=>{
    const m = S.missions.find(x=>x.id===n.missionId), c = S.collabs.find(x=>x.id===n.collabId);
    if(!m||!c) return;
    if(m.end && m.end < T){ n.status='cancelled'; return }
    if(n.due<=T && !n.sentAt){ n.sentAt=n.due; mailTo(S,recipients(S,n),'Suivi à réaliser : '+n.label+' · '+c.name,c.name+' ('+m.client+'). Le suivi '+n.category.toLowerCase()+' « '+n.label+' » est attendu pour le '+fmtY(n.due)+'.',n.due,'jalon') }
    const r = add(n.due,3);
    if(r<=T && !n.relanceAt){ n.relanceAt=r; mailTo(S,recipients(S,n),'Relance : '+n.label+' · '+c.name,'Ce suivi n\'est toujours pas complété. Échéance dépassée depuis le '+fmtY(n.due)+'.',r,'relance') }
  });
}

/* ---------- Persistance locale ---------- */
const KEY = 'inov-suivi-mission-v3';
let S;
try{ S = JSON.parse(localStorage.getItem(KEY)) }catch(e){ S = null }
if(!S || S.version!==3){ S = buildSeedHistory(seed()) }
processNotifs(S);

const myCat = () => ({Manager:'Manager',RH:'RH',Commercial:'Commercial'})[me().role] || null;
const collab = id => S.collabs.find(c=>c.id===id);
const mission = id => S.missions.find(m=>m.id===id);
const mStatus = m => m.start > T ? 'Prévue' : (m.end && m.end < T ? 'Terminée' : 'Active');
const scope = () => { const u = me(); return S.collabs.filter(c => u.role!=='Manager' || c.managerId===u.id) };
const inScope = id => scope().some(c=>c.id===id);
const curMission = c => S.missions.filter(m=>m.collabId===c.id && mStatus(m)!=='Terminée').sort((a,b)=>a.start<b.start?-1:1)[0] || S.missions.filter(m=>m.collabId===c.id).sort((a,b)=>a.start>b.start?-1:1)[0];
const isMine = n => { const u = me(), c = collab(n.collabId); if(!c) return false;
  if(u.role==='Admin') return true; if(n.category!==myCat()) return false;
  if(u.role==='Manager') return c.managerId===u.id; if(u.role==='Commercial') return c.commercialId===u.id; return true };
const canFill = cat => me().role==='Admin' || myCat()===cat;
const canCreateMission = c => { const u = me(); return u.role==='Admin' || u.role==='RH' || (u.role==='Manager' && c.managerId===u.id) };
const latestTemplates = () => { const by = {}; S.templates.forEach(t=>{ if(!by[t.family] || by[t.family].version < t.version) by[t.family]=t }); return Object.values(by) };
const meteoAnswer = f => { const q = f.snapshot.questions.find(x=>/météo/i.test(x.label)); return q ? f.answers[q.id] : null };
function weather(c){
  const ws = S.warnings.filter(w=>w.collabId===c.id && w.open);
  if(ws.some(w=>w.level==='rouge')) return 'rouge';
  if(ws.some(w=>w.level==='orange')) return 'orange';
  const last = S.followups.filter(f=>f.collabId===c.id && meteoAnswer(f)).sort((a,b)=>a.date<b.date?1:-1)[0];
  const v = last && meteoAnswer(last); return v ? v.toLowerCase() : 'vert';
}

const initials = n => n.split(/\s+/).filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const hue = n => { let h = 0; for(const ch of n) h = (h*31 + ch.charCodeAt(0)) >>> 0; return h % 6 };

/* Soleil de la marque : 8 rayons de traits arrondis, du centre vers l'extérieur */
function sunburst(cls){
  let s = '';
  for(let k=0;k<8;k++){ const a = k*Math.PI/4;
    [[56,66,9],[82,100,11],[116,142,13]].forEach(([r1,r2,w])=>{ const x1=150+r1*Math.cos(a), y1=150+r1*Math.sin(a), x2=150+r2*Math.cos(a), y2=150+r2*Math.sin(a);
      s += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke-width="${w}"/>` }) }
  return `<svg class="${cls}" viewBox="0 0 300 300" aria-hidden="true"><g stroke="#fff" stroke-linecap="round">${s}</g></svg>`;
}

function alertHTML(w, withName){
  const c = collab(w.collabId);
  return `<div class="alert ${w.level}"><span class="dot ${w.level}"></span><div>
    <div><b>${withName?`<a href="#" data-a="open" data-id="${c.id}">${esc(c.name)}</a> · `:''}Alerte ${w.scope==='client'?'client':'collaborateur'}</b></div>

    ${w.open && !withName ? `<button class="btn sec sm" data-a="closeWarn" data-id="${w.id}">Clôturer</button>`:''}</div>`;
}

/* Profil collaborateur */
function vCollab(){
  const c = collab(ui.collabId); if(!c || !inScope(c.id)) { ui.view='collabs'; return vCollabs() }
  const ms = S.missions.filter(m=>m.collabId===c.id).sort((a,b)=>a.start>b.start?-1:1);
  const fs = S.followups.filter(f=>f.collabId===c.id).sort((a,b)=>a.date<b.date?1:-1);
  const cur = curMission(c), w = weather(c);
  const tabs = [['synthese','Profil'],['missions','Missions ('+ms.length+')'],['suivis','Suivis ('+fs.length+')'],['notifs','Notifications']];
  let body = '';
  if(ui.tab==='synthese') body = tabSynthese(c, fs);
  if(ui.tab==='missions') body = tabMissions(c, ms);
  if(ui.tab==='suivis') body = tabSuivis(c, ms, fs);
  if(ui.tab==='notifs') body = tabNotifs(c);
  const fillable = CATS.some(canFill) && ms.some(m=>mStatus(m)!=='Terminée');
  return `<button class="back" data-a="go" data-v="collabs">${ic("back",16)} Collaborateurs</button>
  <div class="head"><div class="profile">${av(c.name,'lg')}<div style="min-width:0"><h1 style="display:flex;align-items:center;gap:10px">${esc(c.name)} <span class="pill ${w==='vert'?'p-ok':w==='orange'?'p-warn':'p-bad'}"><span class="dot ${w}" style="box-shadow:none;width:7px;height:7px"></span>Météo ${w}</span></h1>
    <div class="meta" style="margin-top:6px"><span>${esc(c.poste)}</span><span>Client <b>${esc(cur?.client||'Aucun')}</b></span><span>Manager <b>${esc(userName(c.managerId))}</b></span><span>Commercial <b>${esc(userName(c.commercialId))}</b></span><span class="mono">${esc(c.ext)}</span></div></div></div>
    <div class="actions">
      <button class="btn sec" data-a="addWarn">Ajouter une alerte</button>
      <button class="btn sec" data-a="addEvent">Ajouter un événement</button>
      ${canCreateMission(c)?'<button class="btn sec" data-a="newMission">Nouvelle mission</button>':''}
      ${fillable?`<button class="btn grad" data-a="newF">${ic('plus',16)} Nouveau suivi</button>`:''}

  ${body}`;
}
function tabSynthese(c, fs){
  const wsOpen = S.warnings.filter(w=>w.collabId===c.id && w.open), wsClosed = S.warnings.filter(w=>w.collabId===c.id && !w.open);
  const evs = S.events.filter(e=>e.collabId===c.id).sort((a,b)=>a.date<b.date?-1:1);
  const next = CATS.map(cat=>({cat, n:S.notifs.filter(n=>n.collabId===c.id && n.category===cat && n.status==='pending').sort((a,b)=>a.due<b.due?-1:1)[0]}));
  const sum = S.summaries?.[c.id];
  return `<div class="grid g3">${next.map(({cat,n})=>{ const r = n && meetingFor(n);

/* Calendrier */
function vCalendar(){
  const u = me(), start = add(T,-7), days = 42, sc = scope();
  const dayList = Array.from({length:days},(_,i)=>add(start,i));
  const idx = d => diff(d,start);
  const W = 30;
  const rowFor = c => {
    const items = [];
    const nots = CATS.map(cat=>S.notifs.filter(n=>n.collabId===c.id && n.category===cat && n.status==='pending' && (!ui.calMine || isMine(n))).sort((a,b)=>a.due<b.due?-1:1)[0]).filter(Boolean);
    nots.forEach(n=>{ const r = meetingFor(n);
      if(r){ if(r.date>=start && idx(r.date)<days) items.push({l:idx(r.date),w:1.6,cls:'g-meet '+n.category,txt:r.time,act:'meet',id:r.id,title:'RDV '+n.category+' : '+n.label+' le '+fmt(r.date)+' à '+r.time}); return }
      if(n.due<T){ items.push({l:idx(T),w:1.6,cls:'g-bar late',txt:'Retard',act:'plan',id:n.id,title:n.category+' : '+n.label+' en retard depuis le '+fmt(n.due)}); return }
      const a = idx(T), b = Math.min(idx(n.due), days-1); if(a>=days) return;
      items.push({l:a,w:Math.max(1.6,b-a+1),cls:'g-bar '+n.category,txt:n.category+' · '+n.label,act:'plan',id:n.id,title:'À planifier avant le '+fmt(n.due)+' : '+n.category+' '+n.label});
    });
    S.meetings.filter(r=>r.collabId===c.id && r.followupId && r.date>=start && r.date<T).forEach(r=>items.push({l:idx(r.date),w:1,cls:'g-done',txt:'✓',act:'viewF',id:r.followupId,title:'RDV réalisé'}));
    S.followups.filter(f=>f.collabId===c.id && f.date>=start && f.date<=T && (!ui.calMine || f.snapshot.category===myCat() || u.role==='Admin')).forEach(f=>items.push({l:idx(f.date),w:1,cls:'g-done',txt:'✓',act:'viewF',id:f.id,title:f.snapshot.category+' : '+f.snapshot.name+' réalisé le '+fmt(f.date)}));
    S.events.filter(e=>e.collabId===c.id && e.date>=start && idx(e.date)<days).forEach(e=>items.push({l:idx(e.date),w:1,cls:'g-ev',txt:'★',act:'open',id:c.id,title:e.title+' le '+fmt(e.date)}));
    // empilement simple pour éviter les chevauchements
    const lanes = []; items.sort((a,b)=>a.l-b.l).forEach(it=>{ let k = lanes.findIndex(end=>end<=it.l); if(k<0){ k=lanes.length; lanes.push(0) } lanes[k]=it.l+it.w+0.15; it.lane=k });
    const h = Math.max(52, 12 + lanes.length*24);
    return `<div class="g-row"><div class="g-name">${av(c.name,'sm')}<div><b>${esc(c.name)}</b><span>${esc(curMission(c)?.client||'')}</span></div></div>
      <div class="g-track" style="height:${h}px"><div class="g-days">${dayList.map(d=>`<i class="${[0,6].includes(parse(d).getDay())?'we':''}"></i>`).join('')}</div>
      <div class="g-today" style="left:${idx(T)*W+W/2}px"></div>
      ${items.map(it=>`<button class="g-item ${it.cls}" style="left:${it.l*W+2}px;width:${it.w*W-4}px;top:${8+it.lane*24}px" data-a="${it.act}" data-id="${it.id}" title="${esc(it.title)}" aria-label="${esc(it.title)}">${esc(it.txt)}</button>`).join('')}
      </div></div>` };
  const toPlan = S.notifs.filter(n=>n.status==='pending' && inScope(n.collabId) && isMine(n) && !meetingFor(n) && n.due<=add(T,35)).sort((a,b)=>a.due<b.due?-1:1);
  return `<div class="head"><div><h1>Calendrier</h1><p class="sub">Une barre en pointillés court d'aujourd'hui à la date limite tant que le suivi n'est pas planifié. Clique dessus pour planifier.</p></div>
    <div class="seg" role="group" aria-label="Filtre"><button data-a="calMine" data-v="1" aria-pressed="${ui.calMine}">${u.role==='Admin'?'Tous':'Mes jalons'}</button><button data-a="calMine" data-v="0" aria-pressed="${!ui.calMine}">Tous les rôles</button></div></div>
  <div class="legend"><span><i style="background:var(--c-man)"></i>Manager</span><span><i style="background:var(--c-rh)"></i>RH</span><span><i style="background:var(--c-com)"></i>Commercial</span><span><i style="border:1.5px dashed var(--muted)"></i>À planifier</span><span><i style="background:var(--bad-soft);border:1.5px dashed var(--bad)"></i>En retard</span><span><i style="background:var(--ok-soft)"></i>Réalisé</span><span><i style="background:var(--c-ev-soft)"></i>Événement spécial</span></div>
  <div class="gantt" style="--days:${days}"><div class="g-inner">
    <div class="g-row g-head"><div class="g-name"><b>${fmt(start)} au ${fmt(add(start,days-1))}</b><span>${sc.length} collaborateurs</span></div>
      <div class="g-days">${dayList.map(d=>{ const x = parse(d); return `<span class="${d===T?'td':[0,6].includes(x.getDay())?'we':''}">${'DLMMJVS'[x.getDay()]}<br>${x.getDate()}</span>` }).join('')}</div></div>
    ${sc.map(rowFor).join('')}
  </div></div>
  <section class="card"><div class="ch"><h2>À planifier</h2><span class="small muted">L'invitation se télécharge au format Outlook (.ics)</span></div><div class="list">
    ${toPlan.map(n=>`<div class="li"><div><div class="t">${esc(collab(n.collabId).name)} <span class="cat cat-${n.category}">${n.category}</span></div><div class="s">${esc(n.label)} · ${esc(mission(n.missionId).client)}</div><div style="margin-top:4px"><span class="pill ${dueClass(n.due)}">${dueText(n.due)}</span></div></div><button class="btn sm" data-a="plan" data-id="${n.id}">Planifier</button></div>`).join('') || '<div class="empty">Tous tes jalons proches sont planifiés.</div>'}
  </div></section>`;
}

/* ---------- Modales et toasts ---------- */
function modal(title, body, foot){
  $('#modalRoot').innerHTML = `<div class="overlay" data-a="closeModalBg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mT"><div class="mh"><h2 id="mT">${title}</h2><button class="btn ghost sm" data-a="closeModal" aria-label="Fermer">✕</button></div><div class="mb">${body}</div><div class="mf">${foot}</div></div></div>`;
  const f = $('#modalRoot').querySelector('input,select,textarea'); if(f) f.focus();
}
const closeModal = () => $('#modalRoot').innerHTML = '';
let toastT; function toast(msg){ $('#toastRoot').innerHTML = `<div class="toast">${esc(msg)}</div>`; clearTimeout(toastT); toastT = setTimeout(()=>$('#toastRoot').innerHTML='', 3600) }

function planModal(n){
  const c = collab(n.collabId), m = mission(n.missionId);
  const def = n.due < T ? add(T,1) : (diff(n.due,T)>2 ? add(n.due,-2) : n.due);
  modal('Planifier le suivi', `<p><b>${esc(c.name)}</b> · <span class="cat cat-${n.category}">${n.category}</span> ${esc(n.label)} · ${esc(m.client)}</p>
    <p class="small muted">Date limite : ${fmtL(n.due)}</p>
    <div class="grid g2"><div class="field"><label for="pDate">Date</label><input type="date" id="pDate" value="${def}"></div><div class="field"><label for="pTime">Heure</label><input type="time" id="pTime" value="12:30"></div></div>
    <div class="field"><label for="pTitle">Intitulé</label><input type="text" id="pTitle" value="${esc(n.label+' · '+c.name)}"></div>
    <p class="small muted">Conseil : midi ou après 17h pour ne pas gêner le client.</p>`,
    `<button class="btn sec" data-a="closeModal">Annuler</button><button class="btn" data-a="savePlan" data-id="${n.id}">Planifier</button>`);
}
function meetModal(r){
  const c = collab(r.collabId), n = S.notifs.find(x=>x.id===r.notifId);
  modal('Rendez-vous de suivi', `<p><b>${esc(r.title)}</b></p><p>${fmtL(r.date)} à ${r.time} · organisé par ${esc(userName(r.organizerId))}</p>
    <p class="small muted">Invités : ${esc(c.name)} (${esc(c.email)})</p>`,
    `<button class="btn sec" data-a="ics" data-id="${r.id}" ${downloads?'':'disabled title="Téléchargement indisponible dans cette vue"'}>Invitation Outlook (.ics)</button>${n && n.status==='pending' && canFill(n.category)?`<button class="btn" data-a="fill" data-id="${n.id}">Remplir le suivi</button>`:''}`);
}
function icsFor(r){
  const c = collab(r.collabId), org = S.users.find(u=>u.id===r.organizerId);
  const dt = (r.date+'T'+r.time.replace(':','')+'00').replace(/-/g,'');
  const [h,mi] = r.time.split(':').map(Number); const endH = pad(h+1)+pad(mi);
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Inov Team//Suivi de Mission//FR','METHOD:REQUEST','BEGIN:VEVENT','UID:'+r.id+'@suivi.inov-team.fr','DTSTAMP:'+T.replace(/-/g,'')+'T080000','DTSTART;TZID=Europe/Paris:'+dt,'DTEND;TZID=Europe/Paris:'+r.date.replace(/-/g,'')+'T'+endH+'00','SUMMARY:'+r.title,'DESCRIPTION:Suivi de mission Inov Team','ORGANIZER;CN='+org.name+':mailto:'+org.email,'ATTENDEE;CN='+c.name+';RSVP=TRUE:mailto:'+c.email,'END:VEVENT','END:VCALENDAR'].join('\r\n');
}

  const t = (family && tpls.find(x=>x.family===family)) || tpls[0];
  ui.draft = {collabId, missionId: missionId || ms[0]?.id, templateId: t?.id, answers:{}, comment:'', transcript:'', err:''};
  ui.view='followupNew'; render(); window.scrollTo(0,0);
}

    else { const fam = uid('tf'); S.templates.push({id:fam+'_v1',family:fam,version:1,name:d.name.trim(),category:d.category,system:false,active:true,published:true,questions:d.questions}); toast('Template publié.') }
    save(); ui.view='templates'; ui.tplDraft=null; render() },
  notified(d,el){ const c = collab(ui.collabId); c.notified = el.checked ? [...new Set([...c.notified,d.id])] : c.notified.filter(x=>x!==d.id); save(); toast('Liste de notification mise à jour.') },
  reset(){ modal('Réinitialiser la démo', '<p>Les suivis, missions et templates créés pendant la démo seront effacés de ce navigateur.</p>', '<button class="btn sec" data-a="closeModal">Annuler</button><button class="btn danger" data-a="doReset">Réinitialiser</button>') },
  doReset(){ S = buildSeedHistory(seed()); processNotifs(S); save(); closeModal(); ui.view='dashboard'; render(); toast('Démo réinitialisée.') },
  closeModal(){ closeModal() },
  closeModalBg(d,el,e){ if(e.target===el) closeModal() }
};
function syncDraft(){ const d = ui.draft; if(!d) return;
  document.querySelectorAll('[data-q]').forEach(el=>{ if(el.tagName==='TEXTAREA') d.answers[el.dataset.q]=el.value });
  const c = $('#dComment'); if(c) d.comment=c.value; const ia = $('#iaText'); if(ia) d.transcript=ia.value; }
function syncTpl(){ const d = ui.tplDraft; if(!d) return; const n = $('#tName'); if(n) d.name=n.value; const c = $('#tCat'); if(c && !c.disabled) d.category=c.value;
  document.querySelectorAll('[data-tq]').forEach(el=>{ const q = d.questions[Number(el.dataset.tq)]; const k = el.dataset.k;
    if(k==='label') q.label=el.value; if(k==='type') q.type=el.value; if(k==='required') q.required=el.checked; if(k==='options') q.options=el.value.split('\n').map(s=>s.trim()).filter(Boolean) }) }

document.addEventListener('click', e=>{
  const el = e.target.closest('[data-a]'); if(!el) return;
  if(el.type==='checkbox') return;
  const fn = A[el.dataset.a]; if(fn){ fn(el.dataset, el, e) }
});
document.addEventListener('change', e=>{
  const el = e.target;
  if(el.id==='whoSel'){ ui.me = el.value; saveUi(); if(['followupNew','templateEdit','followupView'].includes(ui.view) || (ui.view==='collab' && !inScope(ui.collabId)) || (ui.view==='templates' && me().role!=='Admin')) ui.view='dashboard'; render(); return }
  if(el.type==='checkbox' && el.dataset.a && A[el.dataset.a]) { A[el.dataset.a](el.dataset, el, e); return }
  if(el.id==='fMission'){ ui.fMission=el.value; render() }
  if(el.id==='fCat'){ ui.fCat=el.value; render() }
  if(el.id==='fPeriod'){ ui.fPeriod=el.value; render() }
  if(el.id==='dMission'){ syncDraft(); ui.draft.missionId=el.value; render() }
  if(el.id==='dTpl'){ syncDraft(); ui.draft.templateId=el.value; ui.draft.answers={}; ui.draft.err=''; render() }
  if(el.dataset.k==='type'){ syncTpl(); const q = ui.tplDraft.questions[Number(el.dataset.tq)]; if(q.type==='select' && !q.options.length) q.options=['Option 1','Option 2']; render() }
  if(el.id==='iaFile' && el.files[0]){ const r = new FileReader(); r.onload = () => { syncDraft(); ui.draft.transcript = String(r.result).slice(0,40000); ui.draft.iaStatus='Fichier chargé : '+el.files[0].name; render() }; r.readAsText(el.files[0]) }
});
document.addEventListener('input', e=>{
  if(e.target.id==='search'){ ui.search = e.target.value; const pos = e.target.selectionStart; render(); const s = $('#search'); if(s){ s.focus(); s.setSelectionRange(pos,pos) } }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && $('#modalRoot').innerHTML) closeModal() });

render();
})();
</script>

</body>
</html>
